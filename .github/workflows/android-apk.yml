name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: bun install

      - name: Create and sync the Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Icon, launch screen, microphone permissions and version number
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/prepare-android.sh

      # Every build is signed with the same key, so a new APK installs over the old one.
      - name: Use the shared signing key
        run: |
          mkdir -p ~/.android
          cp android-overrides/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../hamdam.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamdam-android-apk
          path: hamdam.apk
          if-no-files-found: error

      # A direct download link: https://github.com/<owner>/<repo>/releases/latest/download/hamdam.apk
      - name: Publish as the latest release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: همدم — نسخه‌ی اندروید ${{ github.run_number }}
          files: hamdam.apk
          make_latest: true
